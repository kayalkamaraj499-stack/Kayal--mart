server.port=8081
spring.application.name=kayal-mart

# Embedded H2 database (no external database installation required)
spring.datasource.url=jdbc:h2:mem:kayalmart;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console (optional) - http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT configuration
app.jwt.secret=KayalMartSuperSecretJwtSigningKeyChangeInProduction2024
app.jwt.expiration-ms=604800000
